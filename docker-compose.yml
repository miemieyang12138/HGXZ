# HGXZ 黄果下载 - Docker Compose（飞牛 fnOS / 其他 Docker 主机通用）
#
# 部署步骤（飞牛）：
#   1. 把整个项目目录放到 NAS 某个共享文件夹下（如 /vol1/1000/docker/HGXZ）
#   2. cp config.example.json config/config.json   # 容器内路径无需修改
#   3. docker compose up -d --build                # 或用飞牛 Docker 的 Compose 功能创建
#   4. 浏览器打开 http://飞牛IP:8099
services:
  hgxz:
    build:
      context: .
      args:
        # 国内直连 docker.io 会超时，飞牛自带的 docker.fnnas.com 又要求登录，
        # 这里改走 DaoCloud 公共镜像源拉基础镜像。若该源失效，可换其他前缀
        # （如 docker.1ms.run）或删掉本参数直接用 docker.io
        REGISTRY: docker.m.daocloud.io
    image: hgxz:local
    container_name: HGXZ
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./config:/config    # config.json 配置文件
      - ./data:/data        # SQLite 状态数据库
      - ./logs:/logs        # 运行日志
      - ./media:/media      # 视频输出目录（可换成共享文件夹绝对路径，如 /vol1/1000/媒体/黄果:/media）
    environment:
      - TZ=Asia/Shanghai
      - SCHEDULE=03:30
      - UMASK=000
      # 网络能直连站点时不需要代理；如需代理再打开下面三行并填入局域网代理地址
      # - HTTP_PROXY=http://192.168.x.x:port
      # - HTTPS_PROXY=http://192.168.x.x:port
      # - NO_PROXY=127.0.0.1,localhost
    # 默认不自动爬取分类：启动只提供 WebUI，用「搜索下载」页按需下载。
    # 想要每天 SCHEDULE 时间自动全量同步，把下面改成 command: ["--daemon"]
    command: ["--daemon", "--no-sync"]

  # --- 使用 GitHub Actions 自动构建的镜像（不想在 NAS 上 build 时）---
  # 把上面的 build: . 删掉，image 改为下面的地址，并先执行 docker login ghcr.io
  # image: ghcr.io/wx2cyj/hgxz:latest
